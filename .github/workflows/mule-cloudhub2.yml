name: Deploy System API to CloudHub 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contact-onboarding-system-api-sandbox
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"

      - name: Display build environment
        run: |
          java -version
          mvn -version

      - name: Validate required configuration
        shell: bash
        run: |
          test -f pom.xml
          test -f mule-artifact.json
          test -f .maven/settings.xml
          test -n "${ANYPOINT_CLIENT_ID}"
          test -n "${ANYPOINT_CLIENT_SECRET}"
          test -n "${SECURE_KEY}"
          test -n "${ANYPOINT
