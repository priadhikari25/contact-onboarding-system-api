name: Deploy System API to CloudHub 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contact-onboarding-system-api-sandbox
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"

      - name: Display build environment
        run: |
          java -version
          mvn -version

      - name: Validate required configuration
        shell: bash
        run: |
          test -f pom.xml
          test -f mule-artifact.json
          test -f .maven/settings.xml
          test -n "${ANYPOINT_CLIENT_ID}"
          test -n "${ANYPOINT_CLIENT_SECRET}"
          test -n "${SECURE_KEY}"
          test -n "${ANYPOINT_ENVIRONMENT}"
          test -n "${CLOUDHUB_TARGET}"
          test -n "${APPLICATION_NAME}"
          test -n "${MULE_VERSION}"
        env:
          SECURE_KEY: ${{ secrets.SECURE_KEY }}
          ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
          CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          MULE_VERSION: ${{ vars.MULE_VERSION }}

      - name: Validate Maven settings
        run: |
          mvn --batch-mode --errors \
            --settings .maven/settings.xml \
            help:effective-settings

      - name: Run MUnit tests
        run: |
          mvn --batch-mode --errors \
            --settings .maven/settings.xml \
            clean test \
            -Dsecure.key="${{ secrets.SECURE_KEY }}" \
            -DruntimeProduct=MULE_EE

      - name: Publish and deploy to CloudHub 2.0
        run: |
          mvn --batch-mode --errors \
            --settings .maven/settings.xml \
            clean deploy \
            -DmuleDeploy \
            -DskipMunitTests \
            -Danypoint.clientId="${{ secrets.ANYPOINT_CLIENT_ID }}" \
            -Danypoint.clientSecret="${{ secrets.ANYPOINT_CLIENT_SECRET }}" \
            -Danypoint.environment="${{ vars.ANYPOINT_ENVIRONMENT }}" \
            -Dcloudhub.target="${{ vars.CLOUDHUB_TARGET }}" \
            -Dcloudhub.application.name="${{ vars.APPLICATION_NAME }}" \
            -Dapp.runtime="${{ vars.MULE_VERSION }}" \
            -Dsecure.key="${{ secrets.SECURE_KEY }}"
