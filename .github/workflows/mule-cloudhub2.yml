name: Deploy System API to CloudHub 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contact-onboarding-system-api-sandbox
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      SECURE_KEY: ${{ secrets.SECURE_KEY }}
      SECURE_PROPERTIES_FILE: ${{ secrets.SECURE_PROPERTIES_FILE }}

      ANYPOINT_ORG_ID: ${{ vars.ANYPOINT_ORG_ID }}
      ANYPOINT_ENVIRONMENT: ${{ vars.ANYPOINT_ENVIRONMENT }}
      CLOUDHUB_TARGET: ${{ vars.CLOUDHUB_TARGET }}
      APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
      MULE_VERSION: ${{ vars.MULE_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.9.9"

      - name: Display build environment
        shell: bash
        run: |
          java -version
          mvn -version

      - name: Validate required project files
        shell: bash
        run: |
          test -f pom.xml
          test -f mule-artifact.json
          test -f .maven/settings.xml

          echo "Required project files are present."

      - name: Validate required secrets and variables
        shell: bash
        run: |
          test -n "${ANYPOINT_CLIENT_ID}"
          test -n "${ANYPOINT_CLIENT_SECRET}"
          test -n "${SECURE_KEY}"
          test -n "${SECURE_PROPERTIES_FILE}"

          test -n "${ANYPOINT_ORG_ID}"
          test -n "${ANYPOINT_ENVIRONMENT}"
          test -n "${CLOUDHUB_TARGET}"
          test -n "${APPLICATION_NAME}"
          test -n "${MULE_VERSION}"

          echo "Required GitHub secrets and variables are available."

      - name: Validate CloudHub target
        shell: bash
        run: |
          if [ "${CLOUDHUB_TARGET}" != "Cloudhub-US-East-2" ]; then
            echo "Invalid CLOUDHUB_TARGET: ${CLOUDHUB_TARGET}"
            echo "Expected value: Cloudhub-US-East-2"
            exit 1
          fi

          echo "CloudHub target is valid: ${CLOUDHUB_TARGET}"

      - name: Display deployment configuration
        shell: bash
        run: |
          echo "Organization ID: ${ANYPOINT_ORG_ID}"
          echo "Environment: ${ANYPOINT_ENVIRONMENT}"
          echo "Target: ${CLOUDHUB_TARGET}"
          echo "Application: ${APPLICATION_NAME}"
          echo "Mule runtime: ${MULE_VERSION}"

      - name: Verify secret files are not tracked
        shell: bash
        run: |
          TRACKED_SECRET_FILES=$(git ls-files | grep -E '(^|/)local-secrets\.properties$|(^|/)secure\.properties$' || true)

          if [ -n "${TRACKED_SECRET_FILES}" ]; then
            echo "Secret properties files are tracked by Git:"
            echo "${TRACKED_SECRET_FILES}"
            exit 1
          fi

          echo "No secret properties files are tracked."

      - name: Create secure properties file
        shell: bash
        run: |
          mkdir -p src/main/resources/secure

          printf '%s\n' "${SECURE_PROPERTIES_FILE}" > src/main/resources/secure/secure.properties

          if [ ! -s src/main/resources/secure/secure.properties ]; then
            echo "Generated secure.properties file is empty."
            exit 1
          fi

          PROPERTY_COUNT=$(grep -c '=' src/main/resources/secure/secure.properties || true)

          if [ "${PROPERTY_COUNT}" -eq 0 ]; then
            echo "Generated secure.properties file contains no properties."
            exit 1
          fi

          echo "Secure properties file created successfully."
          echo "Property count: ${PROPERTY_COUNT}"

      - name: Validate Maven settings
        shell: bash
        run: >-
          mvn
          --batch-mode
          --errors
          --settings .maven/settings.xml
          help:effective-settings

      - name: Run MUnit tests and package
        shell: bash
        run: >-
          mvn
          --batch-mode
          --errors
          --settings .maven/settings.xml
          clean package
          -Dsecure.key="${SECURE_KEY}"
          -DruntimeProduct=MULE_EE

      - name: Verify Mule application artifact
        shell: bash
        run: |
          ls -la target

          ARTIFACT_COUNT=$(find target -maxdepth 1 -type f -name '*-mule-application.jar' | wc -l)

          if [ "${ARTIFACT_COUNT}" -eq 0 ]; then
            echo "No Mule application JAR was created."
            exit 1
          fi

          echo "Mule application artifact created successfully."

           - name: Publish application version to Anypoint Exchange
        shell: bash
        run: >-
          mvn
          --batch-mode
          --errors
          --settings .maven/settings.xml
          clean deploy
          -DskipMunitTests
          -Dsecure.key="${SECURE_KEY}"

      - name: Deploy published application to CloudHub 2.0
        shell: bash
        run: >-
          mvn
          --batch-mode
          --errors
          --settings .maven/settings.xml
          mule:deploy
          -DskipMunitTests
          -Danypoint.clientId="${ANYPOINT_CLIENT_ID}"
          -Danypoint.clientSecret="${ANYPOINT_CLIENT_SECRET}"
          -Danypoint.orgId="${ANYPOINT_ORG_ID}"
          -Danypoint.environment="${ANYPOINT_ENVIRONMENT}"
          -Dcloudhub.target="${CLOUDHUB_TARGET}"
          -Dcloudhub.application.name="${APPLICATION_NAME}"
          -Dapp.runtime="${MULE_VERSION}"
          -Dsecure.key="${SECURE_KEY}"

      - name: Upload Mule application artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-onboarding-system-api-1.0.1
          path: target/*-mule-application.jar
          if-no-files-found: warn

      - name: Remove generated secure properties file
        if: always()
        shell: bash
        run: |
          rm -f src/main/resources/secure/secure.properties
          echo "Generated secure properties file removed from the GitHub runner."
          echo "Generated secure properties file removed from the GitHub runner."
